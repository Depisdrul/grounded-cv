[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-agent"
version = "0.1.0"
description = "An interview agent that writes CV bullets grounded in typed facts, with a faithfulness evaluation."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-ai-slim[google,openai]",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "ruff==0.17.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cv_agent"]
